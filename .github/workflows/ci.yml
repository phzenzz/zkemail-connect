name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  app-check:
    name: Lint & Build (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 存量代码有 28 个 @typescript-eslint/no-explicit-any 错误，先不阻塞，
      # 修复后把 continue-on-error 去掉即可变为强制门禁
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck & build
        run: npm run build
